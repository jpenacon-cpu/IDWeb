<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Gestión de Tareas</title>

<!-- Bootstrap 5 -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


</head>

<body class="bg-light">


<div class="container mt-5">

    <!-- Encabezado -->
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">
                        Gestión de Tareas
                    </h1>
                </div>

                <div class="card-body">

                    <!-- Formulario -->
                   <form id="todo-form" class="mb-4">
                    <div class="row g-2">
                        <!-- Título de la tarea -->
                        <div class="col-md-4">
                        <input type="text" id="todo-titulo" class="form-control" placeholder="Título de la tarea" required>
                        </div>
                        <!-- Curso -->
                        <div class="col-md-3">
                        <input type="text" id="todo-curso" class="form-control" placeholder="Curso (ej. Web)" required>
                        </div>
                        <!-- Fecha de entrega -->
                        <div class="col-md-3">
                        <input type="date" id="todo-fecha" class="form-control" required>
                        </div>
                        <!-- Botón -->
                        <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Agregar</button>
                        </div>
                    </div>
                    </form>
                    

                    <!-- Lista de tareas -->
                    <h2 class="h5 mb-3">
                        Lista de tareas
                    </h2>
                    <!-- Filtros de Tareas -->
                    <div class="btn-group mb-3 w-100" role="group">
                    <button class="btn btn-outline-primary active" id="btn-todas" onclick="filtrarTareas('todas')">Todas</button>
                    <button class="btn btn-outline-primary" id="btn-pendientes" onclick="filtrarTareas('pendientes')">Pendientes</button>
                    <button class="btn btn-outline-primary" id="btn-completadas" onclick="filtrarTareas('completadas')">Completadas</button>
                    </div>
                    <ul
                        id="todo-list"
                        class="list-group"
                    >
                    </ul>

                </div>

            </div>

        </div>
    </div>

</div>

<!-- JavaScript de la aplicación -->
<script src="app.js"></script>


</body>
</html>
