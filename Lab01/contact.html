    <main>
        <h1>Formulario de Contacto</h1>

        <article>
            <h2>Ponte en contacto conmigo</h2>
            <p>Si tienes alguna consulta, sugerencia o proyecto académico, puedes enviarme un mensaje mediante el siguiente formulario:</p>
            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit">Enviar Mensaje</button>
            </form>
    </main>

    <footer>
